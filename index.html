<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고객관리 센터</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root{ --mint:#00c7be; --mint-dark:#00a89f; --line:#e3e6ec; --bg:#f4f6f9; --muted:#6b7280; --ink:#1f2330; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:"Pretendard",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    a{ color:var(--mint-dark); }
    button{ font-family:inherit; }

    /* 로그인 */
    #login{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-card{ background:#fff; padding:40px; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.08); width:340px; text-align:center; }
    .login-card .logo{ font-size:22px; font-weight:800; color:var(--mint-dark); margin-bottom:6px; letter-spacing:-.01em; }
    .login-card .sub{ font-size:12px; color:var(--muted); margin-bottom:22px; }
    input[type=text],input[type=password],input[type=email],input[type=date],input[type=number],textarea,select{
      width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
      font-family:inherit; font-size:13.5px; background:#fcfcfd; color:var(--ink);
    }
    textarea{ resize:vertical; line-height:1.5; }
    .btn{ background:var(--mint); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn:hover{ background:var(--mint-dark); }
    .btn.ghost{ background:#fff; color:var(--mint-dark); border:1px solid var(--mint); }
    .btn.tiny{ padding:6px 11px; font-size:12.5px; border-radius:7px; }
    .btn.danger{ background:#fff; color:#b42318; border:1px solid #f0c2bc; }
    .btn:disabled{ opacity:.5; cursor:default; }
    .msg.ok{ color:#157347; } .msg.err{ color:#b42318; }

    /* 헤더 */
    header.top{ background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
    .top-in{ max-width:1500px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; gap:14px; }
    .top-in .brand{ font-weight:800; color:var(--mint-dark); font-size:16px; }
    .top-in .sp{ flex:1; }
    .top-in .who{ color:var(--muted); font-size:13px; }

    /* 워크스페이스 전환 (정부지원 / 일반) */
    .wsswitch{ display:inline-flex; background:#eef1f5; border-radius:9px; padding:3px; gap:2px; }
    .wsbtn{ background:none; border:0; padding:7px 14px; font-size:13px; font-weight:700; color:var(--muted); border-radius:7px; cursor:pointer; white-space:nowrap; }
    .wsbtn.active{ background:#fff; color:var(--mint-dark); box-shadow:0 1px 3px rgba(0,0,0,.08); }

    /* 탭 */
    .tabs{ max-width:1500px; margin:0 auto; padding:0 22px; display:flex; gap:4px; }
    .tab{ background:none; border:0; border-bottom:3px solid transparent; padding:12px 16px; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer; }
    .tab.active{ color:var(--mint-dark); border-bottom-color:var(--mint); }

    main#panel{ max-width:1500px; margin:0 auto; padding:20px 22px 90px; }
    .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
    .card h2{ font-size:15px; margin:0 0 14px; color:var(--mint-dark); font-weight:700; }

    /* 통계 카드 */
    .stats{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .stat{ flex:1; min-width:150px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
    .stat .n{ font-size:23px; font-weight:800; }
    .stat .l{ font-size:12px; color:var(--muted); margin-top:2px; }
    .stat.total .n{ color:var(--ink); }
    .stat.req .n{ color:#1d6fe0; }
    .stat.doing .n{ color:#c77700; }
    .stat.done .n{ color:#157347; }
    .stat.sales .n{ color:var(--mint-dark); }

    /* 툴바 */
    .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .toolbar select, .toolbar input[type=text]{ width:auto; min-width:130px; }
    .toolbar .sp{ flex:1; }

    /* 분류 하위 탭 */
    .subtabs{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:14px; border-bottom:2px solid var(--line); padding-bottom:0; }
    .subtabs-label{ font-size:12px; font-weight:700; color:var(--muted); margin-right:6px; align-self:flex-end; padding-bottom:8px; }
    .subtab{ position:relative; background:none; border:0; padding:8px 14px; font-size:13.5px; font-weight:700; color:var(--muted); cursor:pointer; border-radius:8px 8px 0 0; margin-bottom:-2px; border-bottom:2px solid transparent; white-space:nowrap; }
    .subtab:hover{ color:var(--mint-dark); background:#f4faf9; }
    .subtab.active{ color:var(--mint-dark); border-bottom-color:var(--mint); }
    .subtab .cnt{ display:inline-block; min-width:16px; padding:0 5px; margin-left:3px; font-size:11px; font-weight:700; line-height:16px; text-align:center; color:var(--muted); background:#eef1f4; border-radius:9px; }
    .subtab.active .cnt{ color:#fff; background:var(--mint); }
    .cattag{ display:inline-block; font-size:11px; font-weight:700; color:var(--mint-dark); background:#eaf7f6; border:1px solid #cfeceb; border-radius:6px; padding:1px 6px; margin-right:5px; vertical-align:middle; white-space:nowrap; }

    /* 페이지 이동 바 */
    .pager{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center; margin-top:12px; padding:6px; }
    .pager .pginfo{ font-size:12.5px; color:var(--muted); margin:0 8px; }
    .pager .pginfo b{ color:var(--mint-dark); }
    .pager input[type=number]{ width:64px; text-align:center; }
    .pager button[disabled]{ opacity:.4; cursor:default; }

    /* 선택 삭제 바 */
    .selbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; padding:9px 13px; background:#fff6f5; border:1px solid #f6d5d1; border-radius:10px; }
    .selbar .selcnt{ font-size:13px; color:#b42318; margin-right:auto; }
    .selbar .selcnt b{ font-size:14.5px; }

    /* 테이블 */
    th.selcol, td.selcol{ width:36px; text-align:center; padding:6px 4px; }
    .selcol input[type=checkbox]{ width:16px; height:16px; cursor:pointer; accent-color:var(--mint-dark); }
    tbody tr.selrow{ background:#fff6f5; }
    tbody tr.selrow:hover{ background:#ffeceb; }
    .tablewrap{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:auto; }
    table{ border-collapse:collapse; width:100%; font-size:13px; min-width:1150px; }
    thead th{ background:#f7f9fb; border-bottom:1px solid var(--line); text-align:left; padding:9px 9px; font-weight:700; color:#41474f; white-space:nowrap; }
    tbody td{ border-bottom:1px solid #eef1f4; padding:6px 8px; vertical-align:top; }
    tbody tr:hover{ background:#fafcfd; }
    td.no{ text-align:center; color:var(--muted); font-weight:600; width:40px; }
    tbody td input, tbody td textarea, tbody td select{ padding:6px 8px; font-size:12.5px; }
    td.date input{ min-width:120px; }
    td.amt input{ text-align:right; }
    textarea.inq{ min-height:34px; min-width:200px; }
    .tag{ display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:#eef7f6; color:var(--mint-dark); white-space:nowrap; }
    select.contract{ min-width:82px; }
    select.f-program{ min-width:115px; }
    td select[data-f="channel"]{ min-width:80px; }
    .rowdel{ color:#b42318; cursor:pointer; border:0; background:none; font-size:16px; line-height:1; }
    .empty{ padding:40px; text-align:center; color:var(--muted); }

    /* 매출 통계 */
    .yeargrid{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
    .yearcol{ flex:1; min-width:320px; }
    table.sum{ min-width:0; }
    table.sum td, table.sum th{ padding:8px 10px; }
    table.sum td.r, table.sum th.r{ text-align:right; }
    table.sum tr.tot td{ font-weight:800; background:#f2fbfb; border-top:2px solid var(--mint); }
    .mbar{ height:8px; border-radius:5px; background:#eef1f5; overflow:hidden; margin-top:4px; min-width:80px; }
    .mbar > i{ display:block; height:100%; background:var(--mint); }

    /* 체크박스 그룹 (관심 지원사업) */
    .chkgroup{ display:flex; flex-wrap:wrap; gap:4px 10px; }
    .chk{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--ink); cursor:pointer; user-select:none; white-space:nowrap; }
    .chk input{ width:auto; }

    /* 저장바 */
    .savebar{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
      padding:12px 22px; display:flex; gap:12px; align-items:center; justify-content:flex-end; z-index:30; }
    .savebar .msg{ margin-right:auto; font-size:13px; }
    .savebar .dirty{ color:#c77700; font-weight:600; }
    .hidden{ display:none !important; }
    .infobar{ background:#e8fbfa; border:1px solid #b6ecea; color:#0b7d77; border-radius:10px; padding:11px 15px; font-size:13px; line-height:1.6; margin-bottom:16px; }

    /* 문의 첨부 이미지 */
    .imgstrip{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; align-items:center; }
    .imgstrip .thumb{ position:relative; display:inline-block; }
    .imgstrip .thumb img{ width:46px; height:46px; object-fit:cover; border:1px solid var(--line); border-radius:6px; display:block; background:#f7f9fb; }
    .imgstrip .thumbdel{ position:absolute; top:-6px; right:-6px; width:16px; height:16px; line-height:15px; text-align:center; font-size:10px; border:0; border-radius:50%; background:#b42318; color:#fff; cursor:pointer; padding:0; }
    .imgstrip .imgadd{ width:46px; height:46px; border:1px dashed var(--mint); border-radius:6px; color:var(--mint-dark); font-size:20px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
    .imgstrip .imgadd:hover{ background:#eef7f6; }
    .imgstrip .imgadd.busy{ opacity:.5; cursor:default; }

    /* 계약내용 버튼 */
    .contractbtn{ white-space:nowrap; }
    td.ccell{ text-align:center; }

    /* 계약내용 모달 */
    .modal{ position:fixed; inset:0; background:rgba(20,24,32,.5); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:34px 16px; overflow:auto; }
    .modal-card{ background:#fff; width:820px; max-width:100%; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .modal-head{ display:flex; align-items:center; gap:12px; padding:18px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; border-radius:14px 14px 0 0; z-index:1; }
    .modal-head h2{ margin:0; font-size:17px; color:var(--mint-dark); }
    .modal-head .who2{ font-size:13px; color:var(--muted); }
    .modal-head .x{ margin-left:auto; border:0; background:none; font-size:22px; line-height:1; cursor:pointer; color:var(--muted); }
    .modal-body{ padding:20px 24px 26px; }
    .fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
    .field{ display:flex; flex-direction:column; gap:5px; }
    .field.full{ grid-column:1 / -1; }
    .field > label{ font-size:12.5px; font-weight:700; color:#41474f; }
    .field .num{ display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#eef7f6; color:var(--mint-dark); border-radius:50%; font-size:11px; margin-right:5px; }
    .field textarea{ min-height:74px; }

    /* 첨부파일 목록 */
    .filelist{ display:flex; flex-direction:column; gap:6px; }
    .fileitem{ display:flex; align-items:center; gap:8px; background:#f7f9fb; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12.5px; }
    .fileitem .ic{ font-size:15px; }
    .fileitem a{ font-weight:600; text-decoration:none; word-break:break-all; }
    .fileitem .fdel{ margin-left:auto; border:0; background:none; color:#b42318; font-size:15px; cursor:pointer; line-height:1; }
    .fileadd{ align-self:flex-start; }
    .fileadd.busy{ opacity:.5; cursor:default; }

    /* ===== 홈페이지 유지보수 탭 ===== */
    .mnt-layout{ display:flex; align-items:flex-start; gap:16px; }
    #mnt-side{ position:sticky; top:110px; width:250px; flex:0 0 250px; align-self:flex-start;
      max-height:calc(100vh - 130px); overflow:auto; }
    #mnt-side .navtitle{ font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.06em; margin:2px 4px 10px; }
    .co{ display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:10px;
      padding:12px 13px; margin-bottom:9px; cursor:pointer; }
    .co:hover{ border-color:var(--mint); }
    .co.active{ border-color:var(--mint); box-shadow:0 0 0 2px rgba(0,199,190,.18); }
    .co .nm{ font-weight:700; font-size:14px; }
    .co .mini{ font-size:11.5px; color:var(--muted); margin-top:3px; }
    .co .bar{ height:6px; border-radius:4px; background:#eef1f5; margin-top:9px; overflow:hidden; }
    .co .bar > i{ display:block; height:100%; background:var(--mint); }
    .co .pct{ font-size:11px; color:var(--muted); margin-top:4px; }
    #mnt-panel{ flex:1 1 auto; min-width:0; }
    .co-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .co-head h1{ font-size:20px; margin:0; font-weight:800; }
    .co-head .sp{ flex:1; }
    .meta-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px 18px; }
    .meta-grid label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; }
    .bigbar{ height:10px; border-radius:6px; background:#eef1f5; overflow:hidden; margin-top:12px; }
    .bigbar > i{ display:block; height:100%; background:var(--mint); }
    #tab-maint .stat.hold .n{ color:#8a8f97; }
    td.menu{ white-space:nowrap; }
    td.loc{ font-weight:600; }
    td.loc .loctxt{ line-height:1.4; }
    td.loc .pagelink{ display:inline-block; margin-top:6px; font-size:11px; font-weight:700; color:var(--mint-dark);
      text-decoration:none; background:#eef7f6; border:1px solid #cfeceb; border-radius:6px; padding:3px 8px; white-space:nowrap; }
    td.loc .pagelink:hover{ background:var(--mint); color:#fff; border-color:var(--mint); }
    td.loc .pagelink--test{ background:#fff3e6; border-color:#f3d3a8; color:#a85f00; }
    td.loc .pagelink--test:hover{ background:#e0930c; color:#fff; border-color:#e0930c; }
    td.loc .pagelink--test b{ font-weight:800; font-size:10px; letter-spacing:.03em; }
    td.loc .nolink{ display:inline-block; margin-top:6px; font-size:11px; font-weight:500; color:#9aa0aa; white-space:nowrap; }
    td.cur{ color:#555b63; max-width:280px; white-space:pre-wrap; }
    td.cur .imgtag{ font-size:11px; color:#9aa0aa; }
    textarea.req{ min-height:38px; background:#fffdf4; border-color:#f0e6bf; }
    textarea.rmk{ min-height:38px; }
    .attach{ margin-top:6px; }
    .attach .abtn{ display:inline-block; font-size:11px; font-weight:600; color:var(--mint-dark);
      background:#eef7f6; border:1px solid #cfeceb; border-radius:6px; padding:3px 8px; cursor:pointer; white-space:nowrap; }
    .attach .abtn:hover{ background:var(--mint); color:#fff; border-color:var(--mint); }
    .attach.has{ display:flex; align-items:center; gap:6px; background:#f7fbfb; border:1px solid #dceceb; border-radius:8px; padding:4px 6px; }
    .attach .athumb{ width:34px; height:34px; object-fit:cover; border-radius:5px; border:1px solid #d5e3e2; flex:0 0 34px; background:#fff; }
    .attach .afileicon{ font-size:20px; }
    .attach .aname{ font-size:11px; color:#41474f; line-height:1.3; word-break:break-all; flex:1; min-width:0; }
    .attach .aname em{ color:#9aa0aa; font-style:normal; }
    .attach .arep{ font-size:10.5px; font-weight:600; color:var(--mint-dark); background:#fff; border:1px solid #cfeceb;
      border-radius:5px; padding:2px 6px; cursor:pointer; white-space:nowrap; }
    .attach .arep:hover{ background:var(--mint); color:#fff; border-color:var(--mint); }
    .attach .adel{ border:0; background:none; color:#b42318; cursor:pointer; font-size:14px; line-height:1; padding:0 2px; }
    #tab-maint select.st{ width:92px; min-width:0; }
    .st-wrap{ display:flex; align-items:center; gap:6px; }
    .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 8px; background:#c7ccd3; }
    .dot.req{ background:#1d6fe0; } .dot.doing{ background:#e0930c; }
    .dot.done{ background:#1aa15a; } .dot.hold{ background:#8a8f97; }
    #tab-maint table{ min-width:0; }
    .mnt-modal-bg{ position:fixed; inset:0; background:rgba(20,24,32,.42); display:flex; align-items:center; justify-content:center; z-index:60; }
    .mnt-modal{ background:#fff; border-radius:14px; padding:24px; width:420px; max-width:92vw; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .mnt-modal h3{ margin:0 0 16px; font-size:16px; }
    .mnt-modal label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin:12px 0 5px; }
    .mnt-modal .row{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
    .hint{ font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5; }
  </style>
</head>
<body>
  <!-- 로그인 -->
  <div id="login">
    <div class="login-card">
      <div class="logo">고객관리 센터</div>
      <div class="sub">정부지원사업 · 일반고객 · 매출 · 공고 알림 통합관리</div>
      <input type="password" id="pw" placeholder="비밀번호">
      <div id="loginErr" class="msg err" style="font-size:13px;margin:10px 0 0;min-height:16px;"></div>
      <button class="btn" id="loginBtn" style="width:100%;margin-top:14px;">로그인</button>
    </div>
  </div>

  <!-- 앱 -->
  <div id="app" class="hidden">
    <header class="top">
      <div class="top-in">
        <span class="brand">🗂 고객관리 센터</span>
        <div class="wsswitch">
          <button class="wsbtn active" data-ws="gov">🏛 정부지원사업 고객관리</button>
          <button class="wsbtn" data-ws="gen">👥 일반고객관리</button>
          <button class="wsbtn" data-ws="maint">🛠 홈페이지 유지보수</button>
        </div>
        <span class="sp"></span>
        <span class="who" id="whoCount"></span>
        <button class="btn ghost tiny" id="logoutBtn">로그아웃</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="customers">📋 문의·계약 관리</button>
        <button class="tab" data-tab="stats">📊 문의·매출 통계</button>
        <button class="tab" data-tab="notices">📣 공고 알림 대상</button>
      </div>
    </header>

    <main id="panel">
      <div id="tab-customers"></div>
      <div id="tab-stats" class="hidden"></div>
      <div id="tab-notices" class="hidden"></div>
      <div id="tab-maint" class="hidden"></div>
    </main>

    <div class="savebar">
      <span class="msg" id="saveMsg"></span>
      <button class="btn ghost" id="reloadBtn">되돌리기</button>
      <button class="btn" id="saveBtn">저장하기</button>
    </div>

    <!-- 계약내용(작업 착수 정보) 모달 -->
    <div id="contractModal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h2>📄 계약 작업 착수 정보</h2>
          <span class="who2" id="cmWho"></span>
          <button class="x" id="cmClose" title="닫기">✕</button>
        </div>
        <div class="modal-body" id="cmBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
